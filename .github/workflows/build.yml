name: Build and test Bonfire
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mac:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and run transfer tests on Apple Silicon
        run: |
          sw_vers
          xcodebuild -version
          test "$(uname -m)" = arm64
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 27
          python3 tests/run.py --export-cross "$RUNNER_TEMP/cross-fixtures"
          sh macos/build.sh "$RUNNER_TEMP/build"
          sh macos/package.sh "$RUNNER_TEMP/build/Bonfire.app" dist
          mkdir "$RUNNER_TEMP/update-test"
          ditto "$RUNNER_TEMP/build/Bonfire.app" "$RUNNER_TEMP/update-test/Bonfire.app"
          xcrun clang++ -std=c++17 -fobjc-arc tests/mac_update.mm macos/BundleUpdate.mm -framework Foundation -o "$RUNNER_TEMP/update-test/check"
          "$RUNNER_TEMP/update-test/check" "$(pwd)"/dist/*-Portable.zip "$RUNNER_TEMP/update-test/Bonfire.app" "$(cat VERSION)"
          sh tests/mac_update_service.sh
      - name: Install and launch the shipped Mac application
        run: |
          sudo installer -pkg dist/*-Installer.pkg -target /
          APP=/Applications/Bonfire.app
          codesign --verify --strict --verbose "$APP"
          cmp "$APP/Contents/MacOS/Bonfire" "$RUNNER_TEMP/build/Bonfire.app/Contents/MacOS/Bonfire"
          open -n "$APP"
          for i in {1..20}; do pgrep -x Bonfire >/dev/null && break; sleep 1; done
          sleep 3
          pgrep -x Bonfire
          python3 tests/mac_window.py
          ditto -x -k dist/*-Portable.zip "$RUNNER_TEMP/unpacked"
          codesign --verify --strict "$RUNNER_TEMP/unpacked/Bonfire.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cross-darwin
          path: ${{ runner.temp }}/cross-fixtures/
          retention-days: 1
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows app and test isolated saves
        shell: cmd
        run: |
          for /f "usebackq delims=" %%V in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%V\VC\Auxiliary\Build\vcvars64.bat"
          python tests/run.py --export-cross "%RUNNER_TEMP%\cross-fixtures"
          if errorlevel 1 exit /b 1
          call windows\build.cmd "%RUNNER_TEMP%\build"
          if errorlevel 1 exit /b 1
          python tests/windows_discovery.py "%RUNNER_TEMP%\build\BonfireCore.dll"
      - name: Create portable ZIP and bilingual per-user installer
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'Inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $tool
          if ((Get-FileHash $tool).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') { throw 'Compiler checksum mismatch' }
          $process = Start-Process -FilePath $tool -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode) { throw "Compiler setup failed ($($process.ExitCode))" }
          ./windows/package.ps1 -PublishDir "$env:RUNNER_TEMP/build/publish" -OutputDir dist -Compiler "$dir/ISCC.exe"
      - name: Install and compare shipped Windows binaries
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'BonfireInstall'
          $installer = (Get-ChildItem dist/*-Setup.exe).FullName
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dest`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode) { throw 'Installation failed' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'BonfirePortable'
          Expand-Archive (Get-ChildItem dist/*-Portable.zip).FullName $unpacked
          foreach ($file in 'Bonfire.exe','Bonfire.dll','BonfireCore.dll','Bonfire.pri') {
            if ((Get-FileHash "$dest/$file").Hash -ne (Get-FileHash "$unpacked/$file").Hash) { throw "Mismatch in $file" }
          }
          ./tests/windows_startup.ps1 -Application "$dest/Bonfire.exe"
          $desktopLink = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Bonfire.lnk'
          $menuLink = Join-Path ([Environment]::GetFolderPath('Programs')) 'Bonfire/Bonfire.lnk'
          $shell = New-Object -ComObject WScript.Shell
          foreach ($link in $desktopLink, $menuLink) {
            if ($shell.CreateShortcut($link).TargetPath -ne (Join-Path $dest 'Bonfire.exe')) {
              throw "Missing or incorrect shortcut at $link"
            }
          }
          $silent = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          foreach ($taskOptions in '/MERGETASKS=!desktopicon', '') {
            $arguments = if ($taskOptions) { $silent + $taskOptions } else { $silent }
            $process = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -or (Test-Path -LiteralPath $desktopLink)) {
              throw 'Reinstallation did not respect the desktop shortcut selection'
            }
          }
          $process = Start-Process "$dest/unins000.exe" -ArgumentList $silent -Wait -PassThru
          if ($process.ExitCode -or (Test-Path -LiteralPath $menuLink) -or (Test-Path "$dest/Bonfire.exe")) {
            throw 'Uninstallation did not remove Bonfire and its Start menu shortcut'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: dist/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cross-win32
          path: ${{ runner.temp }}/cross-fixtures/
          retention-days: 1
          if-no-files-found: error
  cross-platform-import:
    needs: [mac, windows]
    strategy:
      matrix:
        include:
          - runner: xcode-27
            python: python3
          - runner: windows-2025
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-*
          path: ${{ runner.temp }}/cross-artifacts
      - name: Import the other operating system's seven game packages
        run: ${{ matrix.python }} tests/renpy_cross.py "${{ runner.temp }}/cross-artifacts"
